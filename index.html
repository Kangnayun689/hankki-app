<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한끼정원 — 건강 도시락 정기배송 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#4E8B3A; --leaf-deep:#2F5A22; --leaf-soft:#E4EFDB; --tomato:#E8573F; --tomato-soft:#FCE3DE;
  --lemon:#F5D547; --lemon-soft:#FBF1C2; --bg:#FBFCF7; --white:#FFFFFF; --ink:#22301F; --sub:#677462; --line:#E3E8DD;
  --title:"Jua",sans-serif; --body:"Gowun Dodum",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9EEE3}
body{font-family:var(--body);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
a{color:inherit;text-decoration:none}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:80px;box-shadow:0 0 0 1px var(--line)}
.ex{display:inline-block;font-size:10.5px;color:var(--sub);border:1px dashed #B9C3B2;border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:middle;line-height:1.6;font-family:var(--body)}

/* 상단 유틸바 */
.util{background:var(--leaf-deep);color:#fff;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;padding:8px 16px}
.util b{color:var(--lemon);font-weight:400}
.util button{color:#fff;opacity:.8;font-size:16px;line-height:1}

/* 헤더 */
header{position:sticky;top:0;z-index:20;background:var(--bg)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.logo{display:flex;align-items:center;gap:7px}
.logo .mark{width:34px;height:34px;border:1.5px dashed #A7B79C;border-radius:9px;display:grid;place-items:center;font-size:9.5px;color:var(--sub);line-height:1.1;text-align:center}
.logo .word{font-family:var(--title);font-size:22px;color:var(--leaf-deep);line-height:1}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid var(--leaf);border-radius:22px;padding:8px 13px;color:var(--sub);font-size:13px;text-align:left;min-width:0}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnb{display:flex;gap:18px;overflow-x:auto;padding:2px 16px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.gnb::-webkit-scrollbar{display:none}
.gnb button{white-space:nowrap;padding:8px 0 10px;font-size:15px;color:var(--sub);border-bottom:3px solid transparent}
.gnb button.on{color:var(--ink);border-color:var(--leaf);font-family:var(--title)}

/* 사진 자리 */
.ph{position:relative;background:var(--tone,#EEF3E8);display:grid;place-items:center;overflow:hidden}
.ph .phl{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--toneInk,#6E7F64);font-size:11.5px;border:1.5px dashed currentColor;border-radius:8px;padding:10px 12px;opacity:.75}

/* 롤링 배너 */
.hero{position:relative;overflow:hidden;margin:14px 16px 0;border-radius:18px;height:290px}
.slides{display:flex;height:100%;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.slide{flex:0 0 100%;display:grid;grid-template-rows:1fr auto;cursor:pointer}
.slide .ph{border-radius:0}
.slide .txt{padding:16px 18px 18px}
.slide .k{font-size:12.5px}
.slide h2{font-family:var(--title);font-weight:400;font-size:24px;line-height:1.3;margin:2px 0 4px}
.slide p{font-size:13px}
.hero .count{position:absolute;right:12px;top:12px;background:rgba(34,48,31,.6);color:#fff;font-size:11.5px;border-radius:12px;padding:3px 10px;z-index:2}
.hero .count button{color:#fff;margin-left:4px;font-size:12px}

/* 바로가기 */
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:18px 10px 4px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.quick .qi{width:48px;height:48px;border-radius:16px;background:var(--leaf-soft);display:grid;place-items:center;color:var(--leaf-deep)}
.quick button:first-child .qi{background:var(--leaf);color:#fff}

/* 섹션 */
section.blk{padding:26px 0 6px}
.stitle{display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px 12px;gap:10px}
.stitle h3{font-family:var(--title);font-weight:400;font-size:21px;line-height:1.25}
.stitle .desc{font-size:12.5px;color:var(--sub);margin-top:2px}
.stitle .more{font-size:12.5px;color:var(--sub);white-space:nowrap}

/* 기획전 */
.weekly{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.weekly button{text-align:left;border-radius:14px;padding:14px;min-height:122px;display:flex;flex-direction:column;justify-content:space-between}
.weekly b{font-family:var(--title);font-weight:400;font-size:17px;line-height:1.3}
.weekly span{font-size:12px}

/* 상품 카드 */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{flex:0 0 146px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;padding:0 16px}
.card{position:relative;cursor:pointer}
.card .ph{aspect-ratio:1/1;border-radius:12px}
.heart{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;z-index:2}
.heart.on svg path{fill:var(--tomato);stroke:var(--tomato)}
.nut{position:absolute;left:6px;top:6px;display:flex;gap:4px;z-index:2}
.nut span{background:rgba(255,255,255,.95);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--leaf-deep)}
.card .nm{font-size:13.5px;line-height:1.4;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.org{font-size:12px;color:#9BA696;text-decoration:line-through;margin-top:3px}
.pr{display:flex;align-items:baseline;gap:5px}
.pct{color:var(--tomato);font-family:var(--title);font-size:17px}
.won{font-family:var(--title);font-size:17px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;padding:0 7px;border-radius:4px;line-height:1.8}
.tag.sub{background:var(--leaf-soft);color:var(--leaf-deep)}
.tag.new{background:var(--lemon-soft);color:#6E5A05}
.tag.best{background:var(--tomato-soft);color:#A33421}
.tag.low{background:#E5EEF5;color:#2D5675}
.stars{font-size:11.5px;color:var(--sub);margin-top:3px}
.addcart{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 0;font-size:13px}
.addcart:active{background:var(--leaf-soft)}

/* 라인 탭 */
.ltabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px}
.ltabs button{border:1.5px solid var(--line);background:var(--white);border-radius:12px;padding:10px 6px;text-align:center}
.ltabs button b{display:block;font-family:var(--title);font-weight:400;font-size:16px}
.ltabs button span{font-size:11.5px;color:var(--sub)}
.ltabs button.on{border-color:var(--leaf);background:var(--leaf-soft)}
.lpanel{margin:0 16px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row .ph{flex:0 0 74px;width:74px;height:74px;border-radius:10px}
.row .info{flex:1;min-width:0}
.row .nm{font-size:13.5px;line-height:1.4}
.row .kc{font-size:12px;color:var(--leaf-deep);margin-top:2px}

/* 후기 */
.reviews{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.reviews::-webkit-scrollbar{display:none}
.rv{flex:0 0 250px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px}
.rv .top{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.rv .st{color:#D9A600;letter-spacing:1px}
.rv p{margin:8px 0 10px;font-size:13.5px;line-height:1.55}
.rv .pn{font-size:12px;color:var(--leaf-deep);border-top:1px solid var(--line);padding-top:8px}

/* 문의 */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.contact button{border-radius:14px;padding:14px;text-align:left;display:flex;gap:10px;align-items:center}
.contact b{display:block;font-family:var(--title);font-weight:400;font-size:15.5px}
.contact span{font-size:11.5px}

/* 정기배송 화면 */
.sub-hero{margin:14px 16px 0;background:var(--leaf);color:#fff;border-radius:18px;padding:18px}
.sub-hero h2{font-family:var(--title);font-weight:400;font-size:23px;line-height:1.3}
.sub-hero p{font-size:13px;opacity:.92;margin-top:4px}
.steps{padding:0 16px}
.step{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.step h4{font-family:var(--title);font-weight:400;font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.step h4 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--leaf);color:#fff;font-size:12.5px;display:grid;place-items:center;font-family:var(--body)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{border:1.5px solid var(--line);background:var(--white);border-radius:20px;padding:6px 14px;font-size:13.5px}
.opts button.on{border-color:var(--leaf);background:var(--leaf);color:#fff}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.days button{border:1.5px solid var(--line);border-radius:12px;padding:8px 0;background:var(--white);font-family:var(--title);font-size:16px}
.days button.on{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf-deep)}
.plan{margin-top:6px}
.plan .pd{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.plan .pd:first-child{border-top:0}
.plan .dn{flex:0 0 32px;height:32px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf-deep);display:grid;place-items:center;font-family:var(--title)}
.plan .pm{flex:1;min-width:0;font-size:13.5px}
.plan .pm small{display:block;color:var(--sub);font-size:11.5px}
.plan .chg{font-size:12px;color:var(--leaf-deep);border:1px solid var(--line);border-radius:14px;padding:3px 10px;background:var(--white)}
.calbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-top:4px}
.calbar .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.calbar .bar i{display:block;height:100%;background:var(--leaf)}
.sum{margin:12px 16px 0;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:13.5px}
.sum .total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:16px}
.sum .total span:last-child{font-family:var(--title);font-size:21px;color:var(--leaf-deep)}
.cta{display:block;width:calc(100% - 32px);margin:14px 16px 0;background:var(--leaf);color:#fff;border-radius:12px;padding:15px;font-family:var(--title);font-size:17px}
.note{font-size:12px;color:var(--sub);padding:8px 16px 0;text-align:center}

/* 카테고리 */
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border:1.5px solid var(--line);background:var(--white);border-radius:18px;padding:5px 13px;font-size:13px}
.chips button.on{border-color:var(--leaf);background:var(--leaf);color:#fff}
.chips button.f.on{background:var(--lemon);border-color:var(--lemon);color:var(--ink)}

/* 빈 화면 */
.empty{padding:64px 24px;text-align:center;color:var(--sub)}
.empty b{display:block;font-family:var(--title);font-weight:400;color:var(--ink);font-size:20px;margin-bottom:6px}
.empty button{margin-top:16px;background:var(--leaf);color:#fff;border-radius:10px;padding:10px 20px}

/* 장바구니 */
.cartlist{padding:0 16px}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--white)}
.qty button{width:30px;height:28px}
.qty span{min-width:26px;display:grid;place-items:center;font-size:13px}
.del{font-size:12px;color:var(--sub);text-decoration:underline;align-self:flex-start}

/* 완료 */
.done{padding:50px 24px 20px;text-align:center}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.done h2{font-family:var(--title);font-weight:400;font-size:24px}
.done p{color:var(--sub);margin-top:6px}

/* 푸터 */
footer{margin-top:34px;padding:22px 16px 26px;background:#EFF3EA;font-size:12px;color:var(--sub);line-height:1.8}
footer .fl{display:flex;align-items:center;gap:7px;margin-bottom:10px}
footer .links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:10px;color:var(--ink)}
footer .links button{font-size:12px;color:var(--ink)}
.contact a.cbtn b{display:block;font-family:var(--title);font-weight:400;font-size:15.5px}
.contact a.cbtn span{font-size:11.5px}
footer .blank{display:inline-block;min-width:90px;border-bottom:1px solid #B9C3B2;color:transparent}

/* 하단 탭바 */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);position:relative}
.tabbar button.on{color:var(--leaf-deep)}
.tabbar .mid .ic{width:46px;height:46px;margin-top:-20px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;border:4px solid var(--white)}
.badge{position:absolute;top:-2px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--tomato);color:#fff;font-size:10.5px;display:grid;place-items:center}

/* 오버레이 */
.overlay{position:fixed;inset:0;z-index:50;display:none}
.overlay.open{display:block}
.overlay .dim{position:absolute;inset:0;background:rgba(34,48,31,.45)}
.searchpanel{position:absolute;left:50%;transform:translateX(-50%);top:0;width:100%;max-width:430px;height:100%;background:var(--bg);overflow-y:auto}
.sp-top{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sp-top input{flex:1;border:1.5px solid var(--leaf);border-radius:22px;padding:9px 14px;background:var(--white)}
.sp-sec{padding:18px 16px 6px}
.sp-sec h5{font-size:14.5px;margin-bottom:10px;display:flex;justify-content:space-between;font-weight:400;font-family:var(--title)}
.sp-sec h5 button{font-size:12px;color:var(--sub);font-family:var(--body)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw button{border:1px solid var(--line);background:var(--white);border-radius:16px;padding:5px 12px;font-size:13px}
.hot{list-style:none;columns:2;column-gap:16px}
.hot li{padding:6px 0;font-size:13.5px;break-inside:avoid}
.hot li button{display:flex;gap:10px;width:100%;text-align:left}
.hot li i{font-style:normal;color:var(--leaf);width:16px;font-family:var(--title)}

.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:430px;max-height:90vh;background:var(--bg);border-radius:20px 20px 0 0;overflow-y:auto;transition:transform .32s cubic-bezier(.3,.7,.2,1)}
.overlay.open .sheet{transform:translate(-50%,0)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto}
.sheet .ph{margin:0 16px;aspect-ratio:4/3;border-radius:14px}
.sheet .body{padding:16px}
.sheet h3{font-family:var(--title);font-weight:400;font-size:21px;line-height:1.35;margin-bottom:4px}
.sheet .dsc{color:var(--sub);font-size:13.5px;margin-bottom:10px}
.sheet .pct,.sheet .won{font-size:24px}
.nutbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.nutbox div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.nutbox b{display:block;font-family:var(--title);font-weight:400;font-size:19px;color:var(--leaf-deep)}
.nutbox span{font-size:11.5px;color:var(--sub)}
.sheet .info{margin-top:12px;padding:12px;background:var(--leaf-soft);border-radius:12px;font-size:13px;color:var(--leaf-deep)}
.sheet .acts{position:sticky;bottom:0;display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.sheet .acts button{border-radius:12px;padding:13px 0;font-family:var(--title);font-size:16px}
.sheet .acts .w{border:1px solid var(--line);background:var(--white);display:grid;place-items:center}
.sheet .acts .c{border:1.5px solid var(--leaf);color:var(--leaf-deep);background:var(--white)}
.sheet .acts .b{background:var(--leaf);color:#fff}
.pick .row{padding:10px 16px}
.pick .row.on{background:var(--leaf-soft)}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:20px;padding:9px 18px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* 헤더 아이콘, 사진 */
.hbtn{position:relative;width:34px;height:34px;display:grid;place-items:center;flex:none}
.hbtn .badge{right:-4px;top:-2px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.logo .mark img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.logo .mark.has{border:0}

/* 마이페이지 */
.me{margin:14px 16px 0;padding:18px;border-radius:18px;background:var(--leaf-soft)}
.me b{font-family:var(--title);font-weight:400;font-size:22px;color:var(--leaf-deep)}
.me p{font-size:13px;color:var(--leaf-deep);margin-top:2px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;background:var(--white);border-radius:12px}
.stat button{padding:12px 0;text-align:center;font-size:12px;color:var(--sub)}
.stat button b{display:block;font-size:19px;color:var(--ink)}
.box{margin:12px 16px 0;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h4{font-family:var(--title);font-weight:400;font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.box h4 small{font-family:var(--body);font-size:12px;color:var(--sub)}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0}
.kv span:first-child{color:var(--sub)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.btns button{border:1px solid var(--line);border-radius:10px;padding:9px 0;font-size:13px;background:var(--white)}
.btns button.pri{background:var(--leaf);border-color:var(--leaf);color:#fff}
.menu{margin:12px 16px 0;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.menu button{display:flex;justify-content:space-between;width:100%;padding:14px 16px;border-top:1px solid var(--line);font-size:14px;text-align:left}
.menu button:first-child{border-top:0}
.menu button span:last-child{color:var(--sub)}
.mtitle{padding:22px 16px 0;font-family:var(--title);font-size:15px;color:var(--sub)}
.ord{padding:12px 0;border-top:1px solid var(--line)}
.ord:first-of-type{border-top:0}
.ord .st{display:inline-block;font-size:11.5px;background:var(--lemon-soft);color:#6E5A05;border-radius:4px;padding:0 7px;margin-bottom:4px}
.ord b{display:block;font-size:14px;font-weight:400}
.ord small{color:var(--sub);font-size:12px}
.cp{display:flex;border:1.5px solid var(--leaf);border-radius:14px;overflow:hidden;margin-top:10px;background:var(--white)}
.cp .l{flex:1;padding:14px}
.cp .l b{display:block;font-family:var(--title);font-weight:400;font-size:21px;color:var(--leaf-deep)}
.cp .l span{font-size:12.5px;color:var(--sub)}
.cp .r{width:84px;border-left:1.5px dashed var(--leaf);display:grid;place-items:center;font-size:13px;color:var(--leaf-deep)}
.cp .r button{color:var(--leaf-deep);font-size:13px;height:100%;width:100%}
.cp.off{opacity:.5;border-color:var(--line)}
.cp.off .r{border-color:var(--line)}

/* 공지·FAQ·문서 */
.list{margin:0 16px;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.acc{border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc>button{display:flex;gap:10px;width:100%;text-align:left;padding:14px 16px;font-size:14px;align-items:flex-start}
.acc>button i{font-style:normal;color:var(--leaf);font-family:var(--title)}
.acc>button em{font-style:normal;margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
.acc .ans{display:none;padding:0 16px 16px 40px;font-size:13.5px;color:var(--sub);line-height:1.7}
.acc.open .ans{display:block}
.doc{padding:0 16px;font-size:14px;line-height:1.8}
.doc h4{font-family:var(--title);font-weight:400;font-size:17px;margin:18px 0 4px}
.doc p{color:var(--ink)}
.todo{background:var(--lemon-soft);color:#6E5A05;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:0 16px 4px}

/* 상담 폼 */
.form{padding:0 16px}
.form label{display:block;font-size:13.5px;margin:14px 0 6px}
.form input,.form textarea,.form select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--white);font:inherit;color:var(--ink)}
.form textarea{min-height:110px;resize:vertical}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--leaf);outline:none}
.form .err{color:var(--tomato);font-size:12.5px;margin-top:4px;min-height:1em}
.form .agree{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:14px}
.form .agree input{width:auto}

/* 확인 시트 */
.confirm{padding:6px 20px 20px;text-align:center}
.confirm h3{font-family:var(--title);font-weight:400;font-size:20px;margin-bottom:6px}
.confirm p{color:var(--sub);font-size:13.5px}
.confirm .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.confirm .two button{border-radius:12px;padding:13px 0;font-family:var(--title);font-size:16px;border:1px solid var(--line);background:var(--white)}
.confirm .two .dang{background:var(--tomato);border-color:var(--tomato);color:#fff}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const camera=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
const ph=(tone,label="상품 사진",ink)=>`<div class="ph" style="--tone:${tone};${ink?`--toneInk:${ink}`:""}"><div class="phl">${camera}${label}</div></div>`;
const toneOf=p=>LINES[p.line].tone;
const phP=(p,label)=>p.img?`<div class="ph" style="--tone:${toneOf(p)}"><img src="${p.img}" alt="${p.n}"></div>`:ph(toneOf(p),label);
const logoHtml=(size)=>`<span class="mark ${BRAND.logo?"has":""}">${BRAND.logo?`<img src="${BRAND.logo}" alt="">`:"로고<br>자리"}</span><span class="word"${size?` style="font-size:${size}px"`:""}>${BRAND.name}</span>`;
const fill=(v,ph="입력 예정")=>v?v:`<span class="blank">${ph}</span>`;
const fmtDate=d=>`${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
function nextDelivery(days,skipWeek){
  const d=new Date();d.setDate(d.getDate()+1+(skipWeek?7:0));
  for(let i=0;i<14;i++){if(days.includes("일월화수목금토"[d.getDay()]))return d;d.setDate(d.getDate()+1)}
  return d;
}
const heartSvg=f=>`<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="${f?"#E8573F":"none"}" stroke="${f?"#E8573F":"#22301F"}" stroke-width="1.8"/></svg>`;
const priceHtml=p=>`${p.o>p.p?`<div class="org">${won(p.o)}</div>`:""}<div class="pr"><span class="pct">${pct(p)}%</span><span class="won">${won(p.p)}</span></div>`;
const tagsHtml=p=>p.t.length?`<div class="tags">${p.t.map(k=>`<span class="tag ${TAG[k][0]}">${TAG[k][1]}</span>`).join("")}</div>`:"";

function card(p,o={}){
  return `<div class="card" onclick="openSheet(${p.id})" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openSheet(${p.id})">
   <div style="position:relative">${phP(p)}<div class="nut"><span>${p.avg?"평균 ":""}${p.kcal}kcal</span><span>단백질 ${p.pro}g</span></div>
   <button class="heart ${S.wish.has(p.id)?"on":""}" aria-label="찜하기" onclick="event.stopPropagation();toggleWish(${p.id},this)">${heartSvg(false)}</button></div>
   <div class="nm">${p.n}</div>${priceHtml(p)}${tagsHtml(p)}<div class="stars">★ ${p.r} (${p.rv.toLocaleString()})</div>
   ${o.cart?`<button class="addcart" onclick="event.stopPropagation();addCart(${p.id})">장바구니 담기</button>`:""}</div>`;
}
function row(p,lead=""){
  return `<div class="row" onclick="openSheet(${p.id})" role="button" tabindex="0">${lead}${phP(p,"사진")}<div class="info"><div class="nm">${p.n}</div>
   <div class="kc">${p.kcal}kcal · 단백질 ${p.pro}g · 당류 ${p.sug}g</div><div class="pr" style="margin-top:2px"><span class="pct" style="font-size:15px">${pct(p)}%</span><span class="won" style="font-size:15px">${won(p.p)}</span></div></div></div>`;
}

/* ===== 화면 ===== */
const GNB=["홈","베스트","신메뉴","기획전","정기배송"];
function renderGnb(){$("#gnb").innerHTML=GNB.map(g=>`<button class="${S.gnb===g?"on":""}" onclick="gnbGo('${g}')">${g}</button>`).join("")}
function gnbGo(g){
  if(g==="정기배송")return go("sub");
  if(g==="베스트"||g==="신메뉴"){S.cat=g;S.gnb=g;return go("category",true)}
  S.gnb=g;go("home",true);
  if(g==="기획전")setTimeout(()=>document.getElementById("sec-plan")?.scrollIntoView({behavior:"smooth"}),30);
}

function home(){
  const deal=[...P].sort((a,b)=>pct(b)-pct(a)).slice(0,6);
  const reco=[1,3,5,7,2,6].map(byId);
  const lp=P.filter(p=>p.line===S.line);
  return `<div class="hero"><div class="slides" id="slides">${BANNERS.map((b,i)=>`<div class="slide" style="background:${b.bg};color:${b.fg}" onclick="${b.act}" role="button" tabindex="0">
     ${b.img?`<div class="ph"><img src="${b.img}" alt=""></div>`:ph(b.tone,"배너 이미지 자리",b.fg==="#fff"?"#fff":"#55634F")}<div class="txt"><div class="k">${b.k}</div><h2>${b.h.replace("\n","<br>")}</h2><p>${b.p}</p></div></div>`).join("")}</div>
     <div class="count"><span id="sno">1</span> / ${BANNERS.length}<button onclick="moveSlide(-1)" aria-label="이전 배너">‹</button><button onclick="moveSlide(1)" aria-label="다음 배너">›</button></div></div>

  <div class="quick">${[
    ["정기배송","go('sub')",'<path d="M4 7h11v9H4zM15 10h3l2 3v3h-5M7 19a1.5 1.5 0 1 0 0-.1M17 19a1.5 1.5 0 1 0 0-.1"/>'],
    ["오늘특가","document.getElementById('sec-deal').scrollIntoView({behavior:'smooth'})",'<path d="M12 3v3M5 9l-2-1M19 9l2-1M7 21h10l-1-9H8z"/>'],
    ["400kcal↓","S.low=true;S.cat='전체';go('category')",'<path d="M12 3c3 4 5 6.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-5 1 2 3 2 3-5z"/>'],
    ["후기","document.getElementById('sec-rv').scrollIntoView({behavior:'smooth'})",'<path d="M4 5h16v11H9l-5 4z"/>'],
    ["상담","go('consult')",'<path d="M5 12a7 7 0 0 1 14 0v4h-3v-5h3M5 11h3v5H5z"/>']
   ].map(([l,a,d])=>`<button onclick="${a}"><span class="qi"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg></span>${l}</button>`).join("")}</div>

  <section class="blk" id="sec-plan"><div class="stitle"><h3>이번 주 기획전</h3></div>
   <div class="weekly">
    <button style="background:var(--tomato);color:#fff" onclick="S.cat='저당 도시락';go('category')"><b>저당 도시락<br>4종 모아 20%</b><span>11월 16일까지</span></button>
    <button style="background:var(--lemon-soft)" onclick="S.cat='단백질 간식';go('category')"><b>운동 끝, 간식은<br>단백질로</b><span style="color:var(--sub)">2개 이상 무료배송</span></button>
   </div></section>

  <section class="blk" id="sec-deal"><div class="stitle"><div><h3>오늘만 이 가격</h3><div class="desc">자정에 원래 가격으로 돌아가요</div></div><button class="more" onclick="S.cat='전체';go('category')">전체보기</button></div>
   <div class="hscroll">${deal.map(p=>card(p)).join("")}</div></section>

  <section class="blk"><div class="stitle"><div><h3>오늘 한 끼 추천<span class="ex">예시 상품</span></h3><div class="desc">칼로리와 단백질을 같이 보여드려요</div></div></div>
   <div class="grid">${reco.map(p=>card(p,{cart:true})).join("")}</div></section>

  <section class="blk"><div class="stitle"><div><h3>목표에 맞는 라인</h3><div class="desc">내 목표를 고르면 맞는 메뉴만 보여요</div></div></div>
   <div class="ltabs">${Object.entries(LINES).map(([k,v])=>`<button class="${S.line===k?"on":""}" onclick="S.line='${k}';render()" aria-pressed="${S.line===k}"><b>${k}</b><span>${v.d}</span></button>`).join("")}</div>
   <div class="lpanel">${lp.map(p=>row(p)).join("")}</div></section>

  <section class="blk" id="sec-rv"><div class="stitle"><div><h3>먹어본 분들의 후기<span class="ex">예시 후기</span></h3><div class="desc">별점 평균 4.8 · 후기 ${P.reduce((a,p)=>a+p.rv,0).toLocaleString()}개</div></div><button class="more" onclick="go('reviews')">전체보기</button></div>
   <div class="reviews">${REVIEWS.map(rvCard).join("")}</div></section>

  <section class="blk" id="sec-cs"><div class="stitle"><div><h3>궁금한 게 있으세요?</h3><div class="desc">식단 상담은 ${BRAND.csHours}에 답해드려요</div></div></div>
   <div class="contact">
    <button style="grid-column:1/-1;background:var(--leaf);color:#fff" onclick="go('consult')"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><div><b>1:1 식단 상담 신청</b><span>목표와 고민을 남기면 맞는 메뉴를 알려드려요</span></div></button>
    ${extBtn(BRAND.kakao,"카카오톡 상담","background:#FEE500;color:#3A1D1D",'<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 5.9L6.5 20l3.6-2.4c.6.1 1.2.1 1.9.1 5 0 9-3.1 9-7s-4-6.7-9-6.7z" fill="#3A1D1D"/></svg>',"채널 바로가기")}
    ${extBtn(BRAND.insta,"인스타그램","background:var(--white);border:1px solid var(--line)",'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C13584" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".8" fill="#C13584"/></svg>',"새 메뉴 소식 보기")}
   </div></section>
  ${footer()}`;
}
function rvCard(r){const p=byId(r.pid);return `<div class="rv"><div class="top"><span>${r.n} · ${r.line}</span><span class="st" aria-label="별점 ${r.s}점">${"★".repeat(r.s)}${"☆".repeat(5-r.s)}</span></div><p>${r.t}</p><button class="pn" onclick="openSheet(${p.id})">${p.n} ›</button></div>`}

function reviews(){
  const lines=["전체",...Object.keys(LINES)];
  const list=REVIEWS.filter(r=>S.rvLine==="전체"||r.line===S.rvLine);
  return `<section class="blk"><div class="stitle"><div><h3>후기 모아보기<span class="ex">예시 후기</span></h3><div class="desc">목표별로 골라 볼 수 있어요</div></div></div>
   <div class="chips">${lines.map(l=>`<button class="${S.rvLine===l?"on":""}" onclick="S.rvLine='${l}';render()">${l}</button>`).join("")}</div>
   <div style="display:grid;gap:10px;padding:0 16px">${list.map(r=>rvCard(r).replace('class="rv"','class="rv" style="flex:none"')).join("")}</div></section>${footer()}`;
}

function category(){
  const list=P.filter(p=>(S.cat==="전체"||(S.cat==="베스트"?p.t.includes("best"):S.cat==="신메뉴"?p.t.includes("new"):p.cat===S.cat))&&(!S.low||p.kcal<=400));
  return `<section class="blk"><div class="stitle"><div><h3>${S.cat==="전체"?"전체 메뉴":S.cat}</h3><div class="desc">${list.length}개 메뉴<span class="ex">예시 상품</span></div></div></div>
   <div class="chips"><button class="f ${S.low?"on":""}" onclick="S.low=!S.low;render()" aria-pressed="${S.low}">400kcal 이하</button>${["전체",...CATS].map(c=>`<button class="${S.cat===c?"on":""}" onclick="S.cat='${c}';S.gnb='${c==="베스트"||c==="신메뉴"?c:"홈"}';render()">${c}</button>`).join("")}</div>
   ${list.length?`<div class="grid">${list.map(p=>card(p,{cart:true})).join("")}</div>`:`<div class="empty"><b>조건에 맞는 메뉴가 없어요</b>400kcal 필터를 끄거나 다른 카테고리를 골라보세요.<br><button onclick="S.low=false;S.cat='전체';render()">전체 메뉴 보기</button></div>`}
  </section>${footer()}`;
}

/* 정기배송: 요일별 식단 고르기 */
function autoMenu(day){
  if(S.sub.menu[day])return byId(S.sub.menu[day]);
  const meals=P.filter(p=>p.cat!=="세트"&&p.cat!=="단백질 간식");
  const opts=[...meals.filter(p=>p.line===S.sub.line),...meals.filter(p=>p.line!==S.sub.line)];
  const sd=[...S.sub.days].sort((a,b)=>DAYS.indexOf(a)-DAYS.indexOf(b));
  return opts[Math.max(0,sd.indexOf(day))%opts.length];
}
function subCalc(){
  const per=S.sub.days.reduce((a,d)=>a+autoMenu(d).p,0)*S.sub.meals;
  const base=per*S.sub.weeks; const disc=Math.round(base*(S.sub.weeks>=4?.15:.10)/10)*10;
  const canFirst=S.coupons.first&&!S.coupons.firstUsed;
  const first=canFirst?Math.round((base-disc)*.25/10)*10:0;
  return {base,disc,first,total:base-disc-first};
}
function sub(){
  const c=subCalc(); const sd=[...S.sub.days].sort((a,b)=>DAYS.indexOf(a)-DAYS.indexOf(b)); const on=S.subscription&&S.subscription.active;
  return `<div class="sub-hero"><h2>${on?"정기배송 구성을<br>바꿔볼까요?":"요일만 고르면<br>메뉴는 정원이 짜드려요"}</h2><p>${on?"바꾼 내용은 다음 배송부터 적용돼요":"배송 전날 저녁 6시까지 메뉴를 바꿀 수 있어요"}</p></div>
  <div class="steps">
   <div class="step"><h4><i>1</i>목표를 골라주세요</h4><div class="opts">${Object.keys(LINES).map(k=>`<button class="${S.sub.line===k?"on":""}" onclick="S.sub.line='${k}';S.sub.menu={};render()">${k}</button>`).join("")}</div></div>
   <div class="step"><h4><i>2</i>받을 요일을 골라주세요</h4><div class="days">${DAYS.map(d=>`<button class="${S.sub.days.includes(d)?"on":""}" onclick="toggleDay('${d}')" aria-pressed="${S.sub.days.includes(d)}">${d}</button>`).join("")}</div>
     <div class="opts" style="margin-top:10px">${[1,2].map(m=>`<button class="${S.sub.meals===m?"on":""}" onclick="S.sub.meals=${m};render()">하루 ${m}끼</button>`).join("")}${[1,2,4].map(w=>`<button class="${S.sub.weeks===w?"on":""}" onclick="S.sub.weeks=${w};render()">${w}주${w===4?" (15% 할인)":""}</button>`).join("")}</div></div>
   <div class="step"><h4><i>3</i>요일별 식단을 확인하세요</h4>
     ${sd.length?`<div class="plan">${sd.map(d=>{const p=autoMenu(d);return `<div class="pd"><span class="dn">${d}</span><div class="pm">${p.n}<small>${p.kcal}kcal · 단백질 ${p.pro}g${S.sub.meals>1?` · 하루 ${S.sub.meals}끼`:""}</small>
       <div class="calbar"><span class="bar"><i style="width:${Math.min(100,p.kcal/7)}%"></i></span>${p.kcal}kcal</div></div><button class="chg" onclick="pickMenu('${d}')">메뉴 바꾸기</button></div>`}).join("")}</div>`
     :`<div class="empty" style="padding:20px 0"><b style="font-size:16px">요일을 하나 이상 골라주세요</b></div>`}
   </div>
  </div>
  ${sd.length?`<div class="sum"><div><span>상품 금액 (${sd.length}일 × ${S.sub.meals}끼 × ${S.sub.weeks}주)</span><span>${won(c.base)}</span></div>
   <div><span>정기배송 할인 ${S.sub.weeks>=4?15:10}%</span><span style="color:var(--tomato)">−${won(c.disc)}</span></div>
   ${on?"":(c.first?`<div><span>첫 구독 25% 쿠폰</span><span style="color:var(--tomato)">−${won(c.first)}</span></div>`
     :S.coupons.firstUsed?"":`<div><span>첫 구독 25% 쿠폰</span><button style="color:var(--leaf-deep);text-decoration:underline" onclick="claimCoupon('first')">쿠폰 받고 적용</button></div>`)}
   <div><span>배송비</span><span>무료</span></div>
   <div class="total"><span>${on?"변경 후 결제 금액":"결제 예정 금액"}</span><span>${won(on?c.base-c.disc:c.total)}</span></div></div>
   <button class="cta" onclick="startSub()">${on?"이대로 변경하기":`${won(c.total)} 정기배송 시작하기`}</button>
   <div class="note">언제든 건너뛰거나 해지할 수 있어요. 가격은 예시 상품 기준이에요.</div>`:""}
  ${footer()}`;
}
function toggleDay(d){const a=S.sub.days;S.sub.days=a.includes(d)?a.filter(x=>x!==d):[...a,d];render()}
function pickMenu(day){
  const opts=P.filter(p=>p.cat!=="세트");const cur=autoMenu(day).id;
  $("#sheet").innerHTML=`<div class="grab"></div><div class="body" style="padding-bottom:4px"><h3>${day}요일 메뉴 바꾸기</h3><div class="dsc">원하는 메뉴를 눌러주세요</div></div>
   <div class="pick">${opts.map(p=>`<div class="row ${p.id===cur?"on":""}" onclick="S.sub.menu['${day}']=${p.id};closeSheet(true);toast('${day}요일 메뉴를 바꿨어요')" role="button" tabindex="0">${phP(p,"사진")}<div class="info"><div class="nm">${p.n}</div><div class="kc">${p.kcal}kcal · 단백질 ${p.pro}g · ${p.line}</div></div></div>`).join("")}</div><div style="height:20px"></div>`;
  $("#sheetOv").classList.add("open");document.body.style.overflow="hidden";
}
function sortedDays(){return [...S.sub.days].sort((a,b)=>DAYS.indexOf(a)-DAYS.indexOf(b))}
function startSub(){
  const c=subCalc(); const was=S.subscription&&S.subscription.active; const sd=sortedDays();
  const menu={};sd.forEach(d=>menu[d]=autoMenu(d).id);
  S.subscription={active:true,line:S.sub.line,days:sd,meals:S.sub.meals,weeks:S.sub.weeks,menu,skip:false,price:c.base-c.disc,since:Date.now()};
  if(!was){if(c.first)S.coupons.firstUsed=true;addOrder(`정기배송 · ${S.sub.line} 라인 ${S.sub.weeks}주`,c.total,"정기배송")}
  save();
  doneView(was?"정기배송을 변경했어요":"정기배송을 시작했어요",`${S.sub.line} 라인 · 매주 ${sd.join(", ")} · ${S.sub.weeks}주<br>첫 배송 ${fmtDate(nextDelivery(sd))}${was?"":`<br>결제 금액 ${won(c.total)}`}`,[["내 정기배송 보기","go('my')"],["홈으로 가기","go('home')"]]);
}
function doneView(title,body,btns){
  $("#view").innerHTML=`<div class="done"><div class="ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></div>
   <h2>${title}</h2><p>${body}</p><p style="font-size:12px;margin-top:10px">수업 과제용 시연 화면이에요. 실제 결제는 되지 않아요.</p></div>
   ${btns.map((b,i)=>`<button class="cta" style="${i?"background:var(--white);color:var(--leaf-deep);border:1.5px solid var(--leaf);margin-top:8px":""}" onclick="${b[1]}">${b[0]}</button>`).join("")}${footer()}`;
  renderGnb();renderTabs();scrollTo(0,0);
}
function addOrder(title,total,type){
  const d=new Date();S.orders.unshift({no:"HG"+String(d.getTime()).slice(-8),title,total,type,date:`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`,status:"배송 준비 중"});
}

function wish(){
  const list=P.filter(p=>S.wish.has(p.id));
  return `<section class="blk"><div class="stitle"><div><h3>찜한 메뉴</h3><div class="desc">${list.length}개</div></div><button class="more" onclick="go('my')">마이로</button></div>
   ${list.length?`<div class="grid">${list.map(p=>card(p,{cart:true})).join("")}</div>`:`<div class="empty"><b>찜한 메뉴가 없어요</b>메뉴의 하트를 누르면 여기에 모여요.<br><button onclick="go('category')">메뉴 보러 가기</button></div>`}</section>`;
}
function cartCalc(){
  let org=0,sum=0;Object.keys(S.cart).forEach(id=>{const p=byId(+id);org+=p.o*S.cart[id];sum+=p.p*S.cart[id]});
  const cp=S.coupons.cart&&!S.coupons.cartUsed&&sum>=30000?3000:0;
  const ship=sum>=30000?0:3500;
  return {org,sum,cp,ship,total:sum-cp+ship};
}
function cart(){
  const ids=Object.keys(S.cart).map(Number);
  if(!ids.length)return `<section class="blk"><div class="stitle"><h3>장바구니</h3></div><div class="empty"><b>장바구니가 비어 있어요</b>한 번만 받아보고 싶은 메뉴를 담아보세요.<br><button onclick="go('category')">메뉴 보러 가기</button></div></section>`;
  const c=cartCalc();
  const cpRow=S.coupons.cartUsed?"":!S.coupons.cart?`<div><span>3,000원 할인 쿠폰</span><button style="color:var(--leaf-deep);text-decoration:underline" onclick="claimCoupon('cart')">쿠폰 받기</button></div>`
    :c.cp?`<div><span>3,000원 할인 쿠폰</span><span style="color:var(--tomato)">−${won(c.cp)}</span></div>`:`<div style="font-size:12px;color:var(--sub)"><span>쿠폰은 3만 원 이상 주문할 때 적용돼요</span></div>`;
  return `<section class="blk"><div class="stitle"><div><h3>장바구니</h3><div class="desc">${cartCount()}개 메뉴</div></div></div>
   <div class="cartlist">${ids.map(id=>{const p=byId(id);return `<div class="row" style="cursor:default">${phP(p,"사진")}<div class="info"><div class="nm">${p.n}</div><div class="kc">${p.kcal}kcal · 단백질 ${p.pro}g</div><div class="won" style="font-size:15px">${won(p.p*S.cart[id])}</div>
    <div class="qty"><button aria-label="수량 빼기" onclick="setQty(${id},-1)">−</button><span>${S.cart[id]}</span><button aria-label="수량 더하기" onclick="setQty(${id},1)">+</button></div></div><button class="del" onclick="removeCart(${id})">삭제</button></div>`}).join("")}</div>
   <div class="sum"><div><span>상품 금액</span><span>${won(c.org)}</span></div><div><span>할인 금액</span><span style="color:var(--tomato)">−${won(c.org-c.sum)}</span></div>${cpRow}
    <div><span>배송비 (냉장)</span><span>${c.ship?won(c.ship):"무료"}</span></div>${c.ship?`<div style="font-size:12px;color:var(--sub)"><span>${won(30000-c.sum)} 더 담으면 무료배송</span></div>`:""}
    <div class="total"><span>결제 예정 금액</span><span>${won(c.total)}</span></div></div>
   <button class="cta" onclick="order()">${won(c.total)} 주문하기</button>
   <div class="note">매주 받고 싶다면 <button style="text-decoration:underline;color:var(--leaf-deep)" onclick="go('sub')">정기배송</button>이 더 저렴해요.</div></section>`;
}
function order(){
  const c=cartCalc();const ids=Object.keys(S.cart);const first=byId(+ids[0]);
  addOrder(first.n+(ids.length>1?` 외 ${ids.length-1}건`:""),c.total,"일반 주문");
  if(c.cp)S.coupons.cartUsed=true;
  S.cart={};save();
  const d=new Date();d.setDate(d.getDate()+1);
  doneView("주문을 접수했어요",`주문번호 ${S.orders[0].no}<br>${fmtDate(d)} 도착 예정 · 결제 금액 ${won(c.total)}`,[["주문 내역 보기","go('orders')"],["홈으로 가기","go('home')"]]);
}

  <div class="mtitle">${BRAND.name}</div>
  <div class="menu"><button onclick="go('brand')"><span>브랜드 소개</span><span>›</span></button><button onclick="go('terms')"><span>이용약관</span><span>›</span></button><button onclick="go('privacy')"><span>개인정보처리방침</span><span>›</span></button></div>

function submitConsult(e){
  e.preventDefault();
  const v=id=>$("#"+id).value.trim(); let ok=true;
  const set=(id,msg)=>{$("#e-"+id).textContent=msg;if(msg)ok=false};
  set("cname",v("cname")?"":"이름을 입력해주세요");
  set("ctel",/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(v("ctel"))?"":"연락처를 010-1234-5678 형식으로 입력해주세요");
  set("cmsg",v("cmsg").length>=5?"":"고민 내용을 5자 이상 적어주세요");
  set("cagree",$("#cagree").checked?"":"개인정보 수집·이용에 동의해야 신청할 수 있어요");
  if(!ok)return;
  const d=new Date();S.inquiries.unshift({name:v("cname"),goal:$("#cgoal").value,date:`${d.getMonth()+1}월 ${d.getDate()}일`});save();
  doneView("상담 신청을 받았어요",`${v("cname")}님, ${BRAND.csHours} 중에<br>남겨주신 연락처로 연락드릴게요.`,[["메뉴 둘러보기","go('category')"],["마이로 가기","go('my')"]]);
}

  $("#tabbar").innerHTML=TABS.map(([k,l,d])=>`<button class="${S.view===k||(k==="my"&&MYVIEWS.includes(S.view))?"on":""} ${k==="sub"?"mid":""}" onclick="go('${k}')" aria-label="${l}"><span class="ic"><svg width="${k==="sub"?22:24}" height="${k==="sub"?22:24}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${d}</svg></span>${l}${k==="wish"&&S.wish.size?`<span class="badge" style="background:var(--leaf)">${S.wish.size}</span>`:""}</button>`).join("");
}
function go(v,keepGnb){
  S.view=v;
  if(!keepGnb)S.gnb=v==="sub"?"정기배송":v==="category"&&(S.cat==="베스트"||S.cat==="신메뉴")?S.cat:"홈";
  if(location.hash!=="#"+v)history.replaceState(null,"","#"+v);
  render();scrollTo(0,0);
}
function render(){
  const y=scrollY;$("#view").innerHTML=(VIEWS[S.view]||home)();renderGnb();renderTabs();
  if(S.view==="home"){setSlide(S.slide);startAuto()}else stopAuto();
  scrollTo(0,y);
}
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==S.view)go(h)});

/* 배너 */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function setSlide(i){S.slide=(i+BANNERS.length)%BANNERS.length;const el=$("#slides");if(!el)return;el.style.transform=`translateX(-${S.slide*100}%)`;$("#sno").textContent=S.slide+1}
function moveSlide(d){setSlide(S.slide+d);startAuto()}
function startAuto(){stopAuto();if(!reduce)S.timer=setInterval(()=>setSlide(S.slide+1),4500)}
function stopAuto(){clearInterval(S.timer)}
let sx=null;document.addEventListener("touchstart",e=>{if(e.target.closest(".hero"))sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)moveSlide(dx<0?1:-1);sx=null});

/* 찜·장바구니 */
function toggleWish(id,btn){
  S.wish.has(id)?(S.wish.delete(id),toast("찜을 해제했어요")):(S.wish.add(id),toast("찜했어요"));
  save();if(btn)btn.classList.toggle("on",S.wish.has(id));renderTabs();if(S.view==="wish")render();
}
function addCart(id){S.cart[id]=(S.cart[id]||0)+1;save();renderTabs();toast("장바구니에 담았어요")}
function setQty(id,d){S.cart[id]=Math.max(1,S.cart[id]+d);save();render()}
function removeCart(id){delete S.cart[id];save();render();toast("장바구니에서 뺐어요")}

/* 상세 */
function openSheet(id){
  const p=byId(id);
  $("#sheet").innerHTML=`<div class="grab"></div>${phP(p,"상품 사진 자리")}
   <div class="body"><div class="tags" style="margin:0 0 6px"><span class="tag sub">${p.line} 라인</span>${p.t.filter(t=>t!=="sub").map(k=>`<span class="tag ${TAG[k][0]}">${TAG[k][1]}</span>`).join("")}<span class="ex" style="margin-left:0">예시 상품</span></div>
   <h3>${p.n}</h3><div class="dsc">${p.d}</div>${priceHtml(p)}<div class="stars">★ ${p.r} · 후기 ${p.rv.toLocaleString()}개</div>
   <div class="nutbox"><div><b>${p.kcal}</b><span>${p.avg?"평균 ":""}kcal</span></div><div><b>${p.pro}g</b><span>단백질</span></div><div><b>${p.sug}g</b><span>당류</span></div></div>
   <div class="info">냉장 배송 · 받은 날부터 3일 안에 드세요. 정기배송으로 받으면 10% 더 할인돼요.</div>
   <div class="box" style="margin:12px 0 0"><h4>원재료·알레르기<small>예시 정보</small></h4><p style="font-size:13.5px">알레르기 유발 성분: ${(ALLERGY[p.id]||["입력 예정"]).join(", ")}</p><p style="font-size:12px;color:var(--sub);margin-top:4px">같은 시설에서 우유, 밀, 대두, 견과류를 다뤄요.</p></div>
   ${REVIEWS.filter(r=>r.pid===p.id).map(r=>`<div class="box" style="margin:10px 0 0"><h4>후기<small>${r.n} · ${"★".repeat(r.s)}</small></h4><p style="font-size:13.5px">${r.t}</p></div>`).join("")}</div>
   <div class="acts"><button class="w" aria-label="찜하기" onclick="toggleWish(${id});this.innerHTML=heartSvg(S.wish.has(${id}))">${heartSvg(S.wish.has(id))}</button>
   <button class="c" onclick="addCart(${id});closeSheet()">장바구니 담기</button><button class="b" onclick="S.sub.line='${p.line}';closeSheet();go('sub')">정기배송으로 받기</button></div>`;
  $("#sheetOv").classList.add("open");document.body.style.overflow="hidden";
}
function closeSheet(rerender){$("#sheetOv").classList.remove("open");document.body.style.overflow="";if(rerender||S.view!=="cart")render()}

/* 검색 */
function searchHome(){
  return `${S.recent.length?`<div class="sp-sec"><h5>최근 검색어<button onclick="S.recent=[];save();$('#searchBody').innerHTML=searchHome()">전체 삭제</button></h5><div class="kw">${S.recent.map(r=>`<button onclick="doSearch('${r}')">${r}</button>`).join("")}</div></div>`:""}
   <div class="sp-sec"><h5>많이 찾는 검색어</h5><ol class="hot">${HOT.map((h,i)=>`<li><button onclick="doSearch('${h}')"><i>${i+1}</i>${h}</button></li>`).join("")}</ol></div>`;
}
function openSearch(){$("#searchOv").classList.add("open");$("#searchBody").innerHTML=searchHome();$("#q").value="";setTimeout(()=>$("#q").focus(),50);document.body.style.overflow="hidden"}
function closeSearch(){$("#searchOv").classList.remove("open");document.body.style.overflow=""}
function doSearch(q){
  q=q.trim();if(!q)return;$("#q").value=q;S.recent=[q,...S.recent.filter(r=>r!==q)].slice(0,8);save();
  if(q==="정기배송"){closeSearch();return go("sub")}
  const num=parseInt(q);const w=q.replace(/\s|kcal/g,"");
  const res=num?P.filter(p=>p.kcal<=num):P.filter(p=>(p.n+p.cat+p.line+p.d).replace(/\s/g,"").includes(w));
  $("#searchBody").innerHTML=`<div class="sp-sec"><h5>'${q}' 검색 결과 ${res.length}개</h5></div>${res.length?`<div class="grid" style="padding-bottom:30px">${res.map(p=>card(p)).join("")}</div>`:`<div class="empty"><b>찾는 메뉴가 없어요</b>재료 이름이나 칼로리 숫자로 검색해보세요.<br><button onclick="$('#searchBody').innerHTML=searchHome()">많이 찾는 검색어 보기</button></div>`}`;
}
document.addEventListener("click",e=>{if(e.target.closest("#searchBody .card")&&!e.target.closest(".heart"))closeSearch()},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();closeSearch()}});

let hi=0;const HINTS=["오늘 점심, 400kcal 이하로?","단백질 30g 이상 메뉴 찾기","저당 도시락 신메뉴 보기"];
setInterval(()=>{hi=(hi+1)%HINTS.length;$("#hint").textContent=HINTS[hi]},3500);

$("#hlogo").innerHTML=logoHtml();$("#hlogo").setAttribute("aria-label",BRAND.name+" 홈으로");document.title=BRAND.name+" — 건강 도시락 정기배송 앱";
const h0=location.hash.slice(1);if(VIEWS[h0])S.view=h0;
render();
</script>
</body>
</html>
